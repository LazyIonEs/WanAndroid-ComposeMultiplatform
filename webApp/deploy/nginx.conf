# Include this server block in nginx's http context. Set server_name and root
# for your deployment; terminate HTTPS here or at your existing ingress.
server {
    listen 8080;
    server_name localhost;
    root /srv/wanandroid/dist;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://www.wanandroid.com/;
        proxy_set_header Host www.wanandroid.com;
        proxy_ssl_server_name on;
        proxy_ssl_name www.wanandroid.com;
        proxy_ssl_verify on;
        # Debian/Ubuntu path; replace with your host's CA bundle when needed.
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_cookie_domain wanandroid.com $host;
        proxy_cookie_domain www.wanandroid.com $host;
        proxy_cookie_path / /api/;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
