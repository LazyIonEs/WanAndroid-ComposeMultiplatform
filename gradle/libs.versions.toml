ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
# https://github.com/jordond/MaterialKolor
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "material-kolor" }
# https://github.com/NucleusFramework/ComposeNativeWebview
composewebview = { module = "dev.nucleusframework:composewebview", version.ref = "composewebview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
